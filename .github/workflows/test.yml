name: Test

# Runs `rake test`: the link-checker canary, the talk-PDF existence check, then
# HTMLProofer over the built site. Deliberately does NOT run `rake external`,
# which reaches ~250 third-party hosts and fails on their rate limits and bot
# protection rather than on anything in this repo. Run that one by hand.
on:
  # Both hops a change makes. A topic branch into `main` is where JT reviews the
  # diff, so the result belongs on the PR he is looking at; `main` into `live` is
  # the last point a broken build can be stopped before it is public, since
  # GitHub Pages serves `live`.
  pull_request:
    branches: [main, live]
  # Backstop for anything that reaches main without a PR.
  push:
    branches: [main]
  workflow_dispatch:

# Only read the repo; nothing here needs write access.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # DO NOT set lfs: true. talks/*.pdf is Git LFS and comes to roughly
          # 3.7 GB; fetching it would download the lot on every run and bill the
          # repository's LFS bandwidth quota, which is metered. Nothing here
          # needs the file contents: `rake talks` only asks whether each
          # referenced path exists, and an unsmudged LFS pointer is a real file,
          # so the check works identically without them.
          lfs: false

      - uses: ruby/setup-ruby@v1
        with:
          # Read from .ruby-version so CI and a local machine cannot drift apart:
          # rbenv, rvm, chruby and this action all read that one file. It was
          # '3.1' hardcoded here, which happened to match the local 3.1.6 by
          # coincidence rather than by construction. github-pages pins Jekyll
          # 3.10, which is not happy on much newer Rubies.
          ruby-version: .ruby-version
          bundler-cache: true

      - name: rake test
        run: bundle exec rake test
