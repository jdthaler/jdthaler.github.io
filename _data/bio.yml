# `hover` is the mouse-over tooltip; `alt` is what screen readers announce and
# what shows if the image fails to load. They are different jobs, so they are
# separate fields: `hover` can be a shorthand like a room number, `alt` has to
# describe the picture.
# `image` is the original. Its preview is derived, not stored -- see
# _includes/snippets/get-preview-url.html -- so each path is written once.
# The front page and about page show the original deliberately: those are the
# pages people copy an image from.
index_top:
  image: /images/jthaler_mit_spotlight.jpg
  image_credit: Jared Charney, MIT News
  image_url: https://spotlight.mit.edu/2017/chalkboard-theorist
  hover: Jesse Thaler
  alt: Jesse Thaler writing equations in chalk on a blackboard

about_top:
  image: /images/jthaler_photo_2017.jpg
  image_credit: Jared Charney
  image_url: https://www.jaredcharney.com/
  hover: Jesse Thaler
  alt: Portrait of Jesse Thaler, smiling, in glasses and a grey jacket

personal_top:
  image: /images/stamp_personal.jpg
  hover: Jesse Thaler
  alt: Jesse Thaler in sunglasses and a cap on a hike, with a mountain lake, pine forest and snow-capped peaks behind him
  image_credit: Jesse Thaler

# Biographical prose, kept together so the versions can be read and edited side
# by side. They restate one career in different voices and lengths, so a fact
# that changes has to change in all of them -- which is exactly what went wrong:
# /about was updated for the LNS directorship and the two /press paragraphs were
# not, leaving the press page saying JT still directed IAIFI.
#
# Plain prose, no markdown, so pages insert them with {{ }} directly.
blurbs:

  # /about. First person -- the only one that is.
  about: >
    I am a theoretical particle physicist who fuses techniques from quantum
    field theory and machine learning to address outstanding questions in
    fundamental physics. My current research is focused on maximizing the
    discovery potential of the Large Hadron Collider through new theoretical
    frameworks and novel data analysis techniques. I joined the MIT Physics
    Department in 2010, and I am currently a Professor in the MIT Center for
    Theoretical Physics - a Leinweber Institute. From 2020 to 2025, I was the
    inaugural Director of the NSF Institute for Artificial Intelligence and
    Fundamental Interactions. Starting in 2026, I direct the MIT Laboratory
    for Nuclear Science.

  # /press, the short version, for anyone who needs a paragraph.
  short: >
    Jesse Thaler is a theoretical particle physicist who fuses techniques from
    quantum field theory and machine learning to address outstanding questions
    in fundamental physics. His current research is focused on maximizing the
    discovery potential of the Large Hadron Collider through new theoretical
    frameworks and novel data analysis techniques. Prof. Thaler joined the MIT
    Physics Department in 2010, and he is currently a Professor in the MIT
    Center for Theoretical Physics - a Leinweber Institute. From 2020 to 2025,
    he was the inaugural Director of the NSF Institute for Artificial
    Intelligence and Fundamental Interactions. Starting in 2026, he directs
    the MIT Laboratory for Nuclear Science.

  # /press, under Extended Biography: what the research is.
  research_interests: >
    Jesse Thaler is a theoretical particle physicist who fuses techniques from
    quantum field theory and machine learning to address outstanding questions
    in fundamental physics. His current research is focused on maximizing the
    discovery potential of the Large Hadron Collider (LHC) through new
    theoretical frameworks and novel data analysis techniques. Prof. Thaler is
    an expert in jets, which are collimated sprays of particles that are
    copiously produced at the LHC, and he studies the substructure of jets to
    enhance the search for new phenomena and illuminate the dynamics of gauge
    theories. He is also interested in new strategies to probe the nature of
    dark matter at the LHC and beyond, as well as in the theoretical
    structures and experimental signatures of supersymmetry.

  # /press, under Extended Biography: the career.
  biographical_sketch: >
    Jesse Thaler joined the MIT Physics Department in 2010, and is currently a
    Professor in the MIT Center for Theoretical Physics - a Leinweber
    Institute. From 2006 to 2009, he was a fellow at the Miller Institute for
    Basic Research in Science at the University of California, Berkeley. He
    received his Ph.D. in Physics from Harvard University in 2006, and his
    Sc.B. in Math/Physics from Brown University in 2002. From 2020 to 2025,
    Prof. Thaler was the inaugural Director of the NSF Institute for
    Artificial Intelligence and Fundamental Interactions. Starting in 2026, he
    directs the MIT Laboratory for Nuclear Science.


# Logo tiles on the front page, and nothing else -- named for what they are so
# they are not mistaken for a record of appointments. The CV's Employment and
# Leadership sections do not read this list; `leadership` below is what reaches
# the PDF. A role therefore has to be added in both places, deliberately: the
# titles here are display shorthand rather than dated facts, so they need review
# when a date passes -- "Incoming Director" sat here until August 2026, when the
# LNS directorship actually began.
