# Holiday cards, newest first. The page markup is generated from this list, so
# adding a card is three lines here rather than eighteen lines of nested divs.
#
# back: true renders the front at cell--8 with the back beside it at cell--4;
# omit it for a front-only card, which fills cell--8 alone.
